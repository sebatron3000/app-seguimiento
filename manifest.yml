permissions:
  scopes:
    - read:board-scope:jira-software
    - read:project:jira
    - read:sprint:jira-software
    - write:sprint:jira-software
    - read:jira-work
    - write:jira-work
    - storage:app
    - read:jira-user
  external:
    fetch:
      backend:
        - address: https://api.telegram.org

modules:
  jira:globalPage:
    - key: telegram-sync-page-v2
      resource: main-ui
      render: native
      resolver:
        function: render-page-fn
      title: Telegram Sync
  jira:projectPage:
    - key: telegram-admin-page
      resource: admin-ui
      render: native
      resolver:
        function: render-page-fn
      title: Telegram Admin
  trigger:
    - key: issue-assigned-trigger
      function: handleIssueAssigned
      events:
        - avi:jira:assigned:issue
  webtrigger:
    - key: telegram-webhook
      function: handleTelegramCallback
  scheduledTrigger:
    - key: daily-report-trigger
      function: handleScheduledPings
      interval: hour
  function:
    - key: render-page-fn
      handler: index.pageResolver
    - key: handleIssueAssigned
      handler: index.runTrigger
    - key: handleTelegramCallback
      handler: index.runWebtrigger
    - key: handleScheduledPings
      handler: index.runScheduledPings

resources:
  - key: main-ui
    path: src/frontend/index.jsx
  - key: admin-ui
    path: src/frontend/admin.jsx

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/8ece6349-2e6c-4f68-a9e9-ae7e22817de6
